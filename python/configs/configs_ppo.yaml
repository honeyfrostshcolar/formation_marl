# PPO训练配置
training:
  num_episodes: 1000
  max_steps_per_episode: 100
  learning_rate: 3e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  ppo_epochs: 4
  mini_batch_size: 32
  value_coef: 0.5
  entropy_coef: 0.01

model:
  feature_dim: 21
  max_robots: 10
  min_distance: 0.5
  max_distance: 3.0
  angle_range: [-90, 90]

env:
  safety_threshold: 0.5
  max_comm_distance: 5.0
  grid_width: 200
  grid_height: 200

reward:
  formation_weight: 0.4
  safety_weight: 0.3
  communication_weight: 0.3
  task_weight: 0.0

logging:
  log_interval: 10
  save_interval: 50
  output_dir: ./outputs